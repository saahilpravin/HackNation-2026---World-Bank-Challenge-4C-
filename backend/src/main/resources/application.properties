spring.application.name=lauda-api
server.port=${LAUDA_API_PORT:8080}
server.address=${LAUDA_API_HOST:127.0.0.1}
model.dir=${LAUDA_MODEL_DIR:../ml/artifacts}

lauda.llm.enabled=${LAUDA_LLM_ENABLED:false}
lauda.llm.endpoint=${LAUDA_LLM_ENDPOINT:http://127.0.0.1:11434}
lauda.llm.timeout-seconds=${LAUDA_LLM_TIMEOUT_SECONDS:25}
lauda.translation.endpoint=${LAUDA_TRANSLATION_ENDPOINT:http://127.0.0.1:8085}
lauda.translation.cache=${LAUDA_TRANSLATION_CACHE:.ai-cache/insight-translations.json}
